name: Varia AI Office Worker
# Free GitHub Actions runner drains Supabase queues and starts Natasha's daily planner; no paid Render cron is used.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/varia-office-worker.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: varia-office-worker
  cancel-in-progress: false

jobs:
  process-queued-work:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout agent runtime
        uses: actions/checkout@v4
        with:
          ref: feat/natasha-sales-engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: natasha/api/requirements.txt

      - name: Install runtime dependencies
        run: pip install -r natasha/api/requirements.txt

      - name: Wake the free Render API before processing jobs
        env:
          NATASHA_API_URL: https://natasha-api.onrender.com
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$NATASHA_API_URL/health"; then
              echo
              echo "Natasha API is healthy."
              exit 0
            fi
            echo "API is waking up (attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "Natasha API did not become healthy within 3 minutes."
          exit 1

      - name: Enqueue daily autonomous operating cycle
        env:
          SUPABASE_URL: https://gjnsyufdrgohthuxnqzf.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: INFO
        run: python -m natasha.planner

      - name: Process queued Natasha and Office tasks
        env:
          SUPABASE_URL: https://gjnsyufdrgohthuxnqzf.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NATASHA_API_URL: https://natasha-api.onrender.com
          WORKER_ONESHOT: "1"
          LOG_LEVEL: INFO
        run: python -m natasha.worker
